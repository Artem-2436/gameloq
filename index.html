<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xcortex | Generative Light</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Чистый черный для контраста */
            overflow: hidden;
            touch-action: none; /* Отключаем системные жесты браузера */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Меню управления */
        .ui-container {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            pointer-events: none; /* Чтобы клики проходили сквозь пустые зоны */
        }

        .mode-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .hint-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            pointer-events: none;
            animation: fadeOut 3s forwards;
            text-align: center;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="hint-text">Tap anywhere to create light patterns</div>

    <canvas id="artCanvas"></canvas>

    <div class="ui-container">
        <button class="mode-btn active" onclick="setMode('starburst')" id="btn-starburst">Starburst</button>
        <button class="mode-btn" onclick="setMode('rain')" id="btn-rain">Light Rain</button>
        <button class="mode-btn" onclick="setMode('firework')" id="btn-firework">Firework</button>
    </div>

    <script src="light_engine.js"></script>
</body>
</html>
